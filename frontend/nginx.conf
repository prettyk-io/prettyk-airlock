# Cosmoport 2.0 — nginx SPA + same-origin API edge (COS-094)
#
# Канонический внешний edge — Caddy (:8180, rate limit + TLS).
# Этот nginx — same-origin front door для прямого доступа к SPA (:5174):
# React-приложение зовёт относительный /api/v1/..., поэтому тот же origin
# обязан обслуживать и API — иначе браузер получает SPA-HTML/405 вместо JSON.
#
# Правила:
#   - /api → cosmo-api:8100 (passthrough, путь сохраняется);
#   - SSE-ручки (/api/v1/runs/*/stream, /api/v1/domains/*/events/stream):
#     буферизация OFF, read timeout long — поток живой, чанки идут сразу;
#   - /live /ready /health — честный passthrough (/ready 503 при падении
#     hard-dep, COS-090) без rate limit;
#   - остальное — SPA fallback → index.html (React Router).
#
# Airgap (COS-094): DNS только через Docker embedded resolver (127.0.0.11),
# никаких внешних имён; cosmo-api резолвится каждые 10s (переживает
# пересоздание контейнера API без reload).

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Ingest-пейлоады (SONAR findings, evidence) больше дефолтного 1m.
    client_max_body_size 256m;

    # ── Health endpoints (honest passthrough, no buffering games) ──
    location ~ ^/(live|ready|health)$ {
        set $api_upstream cosmo-api:8100;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ── SSE streams (COS-059 semantics: NOT buffered, long-lived) ──
    # Все три SSE-ручки: runs/*/stream, domains/*/events/stream,
    # notifications/stream (AlertHUD живёт постоянно → timeout 1h).
    location ~ ^/api/v1/(runs/[^/]+/stream|domains/[^/]+/events/stream|notifications/stream)$ {
        set $api_upstream cosmo-api:8100;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── API REST (/api/ → cosmo-api:8100, path preserved) ───────────
    location /api/ {
        set $api_upstream cosmo-api:8100;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    # ── SPA ─────────────────────────────────────────────────────────
    # Cache static assets aggressively (hashed filenames in Vite build)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: любой путь без файла → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

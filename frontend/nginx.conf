# Cosmoport 2.0 — nginx SPA config
# Все запросы отдают index.html (React Router), статика раздаётся как есть.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: любой путь без файла → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (hashed filenames in Vite build)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
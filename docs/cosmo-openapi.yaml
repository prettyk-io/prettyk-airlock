                  summary: Bootstrap до verified + landing_approved
                  value:
                    error:
                      code: INVALID_TRANSITION
                      message: 'Invalid landing transition for ''item-rel-42-envelope'':
                        received → bootstrapped'
                      details:
                        item_id: item-rel-42-envelope
                        from_state: received
                        to_state: bootstrapped
                checksum-mismatch:
                  summary: Post-import checksum verification failed
                  value:
                    error:
                      code: CHECKSUM_MISMATCH
                      message: 'Checksum mismatch for item ''item-rel-42-envelope'':
                        expected 3f79bb7b435b05…, computed 9d4e1e23bd5b7c…'
                      details:
                        expected_sha256: 3f79bb7b435b0532164daea6b234c4d9ab7b435b0532164daea6b234c4d9ab7b
                        computed_sha256: 9d4e1e23bd5b7cd147a9a25b1f9d9e0f9d4e1e23bd5b7cd147a9a25b1f9d9e0f
                        state: checksum_mismatch
                        requires_new_revision: true
                duplicate-revision:
                  summary: Та же package revision уже получена другим item
                  value:
                    error:
                      code: DUPLICATE_REVISION
                      message: Package revision 'rel-42:1' already received by item
                        'item-rel-42-envelope'
                      details:
                        revision_key: rel-42:1
                        existing_item_id: item-rel-42-envelope
                        incoming_item_id: item-rel-42-sbom
        '404':
          description: NOT_FOUND — неизвестный transition ИЛИ item не найден / чужой
            домен
          content:
            application/json:
              examples:
                unknown-transition:
                  summary: Transition вне.allowed-набора
                  value:
                    error:
                      code: NOT_FOUND
                      message: Unknown landing transition 'teleport'
                      details:
                        allowed:
                        - receive

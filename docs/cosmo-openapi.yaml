      description: 'Группировка нескольких TransferItem под общим release identity.


        Один release → один план → несколько TransferItem (по одному на plane).

        Plan не атомарен: один item failed ≠ остальные потеряны.'
    TransferPlanIn:
      properties:
        plan_id:
          type: string
          minLength: 1
          title: Plan Id
        release_id:
          type: string
          minLength: 1
          title: Release Id
        correlation_id:
          type: string
          title: Correlation Id
          default: ''
        source_zone:
          type: string
          title: Source Zone
          default: zr
        target_zone:
          type: string
          title: Target Zone
          default: zt
        items:
          items:
            $ref: '#/components/schemas/TransferItemIn'
          type: array
          title: Items
      type: object
      required:
      - plan_id
      - release_id
      title: TransferPlanIn
      examples:
      - description: Один release → несколько planes; skeleton_context не является
          deployable release.
        summary: 'Multi-plane plan: metadata envelope + SBOM skeleton'
        value:
          correlation_id: corr-rel-42-transfer
          items:
          - artifact_plane: metadata_envelope
            item_id: item-rel-42-envelope
            manifest:
              artifact_plane: metadata_envelope
              payload_refs: []
              release_id: rel-42
              revision: 1
            package_mode: metadata_envelope
            payload_refs: []
            revision: 1
            source_ref: git::gitea/acme/core@v1.2.3
            target_ref: sod-bridge://zt/inbox/core
            transport_profile: direct_authenticated_api
          - artifact_plane: sbom
            item_id: item-rel-42-sbom
            manifest:
              artifact_plane: sbom
              payload_refs:
              - sbom/cdx.json
              release_id: rel-42
              revision: 1
            package_mode: skeleton_context
            payload_refs:
            - sbom/cdx.json
            revision: 1
            source_ref: git::gitea/acme/core@v1.2.3
            target_ref: diode://zt/inbox/core-sbom
            transport_profile: one_way_diode_relay
          plan_id: plan-rel-42-1
          release_id: rel-42
          source_zone: zr
          target_zone: zt
      - description: 'Только manifest + references: инвариант ''metadata envelope
          ≠ deployable release''.'
        summary: Metadata-only skeleton (не deployable)
        value:
          correlation_id: corr-rel-42-skeleton
          items:
          - artifact_plane: source_code
            item_id: item-rel-42-skel
            manifest:
              release_id: rel-42
              revision: 1
            package_mode: skeleton_context
            revision: 1
            source_ref: git::gitea/acme/core@v1.2.3
          plan_id: plan-rel-42-skel
          release_id: rel-42

openapi: 3.1.0
info:
  title: Cosmoport 2.0 API
  description: Sovereign Run Control Plane — управление жизненным циклом безопасности
    разработки
  version: 0.2.0
paths:
  /live:
    get:
      tags:
      - health
      summary: Live
      description: Процесс жив. Самый лёгкий эндпоинт — без зависимостей.
      operationId: live_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
  /ready:
    get:
      tags:
      - health
      summary: Ready
      description: "Готовность принимать трафик (K8s readiness-семантика).\n\n200:\
        \ ядро способно обслуживать запросы (PostgreSQL жив). Мягкие\n     деградации\
        \ (Valkey → SSE in-memory fallback, anchor sink) видны\n     в теле как status=\"\
        degraded\", но НЕ выводят инстанс из ротации.\n503: недоступен hard-dep PostgreSQL\
        \ + честный компонент-мап в теле,\n     чтобы Caddy/upstream вывел инстанс\
        \ из ротации."
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /health:
    get:
      tags:
      - health
      summary: Health
      description: 'Расширенная диагностика.


        200 всегда — даже при недоступных зависимостях.

        Информация о состоянии возвращается в теле ответа.

        Credentials НЕ раскрываются.'
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  schemas:
    AppGraph:
      properties:
        domain:
          type: string
          minLength: 1
          title: Domain
          description: ID домена
        groups:
          items:
            $ref: '#/components/schemas/Group'
          type: array
          title: Groups
          description: Группы (папки) приложений
        apps:
          items:
            $ref: '#/components/schemas/Application'
          type: array
          title: Apps
          description: Приложения уровня 1-3
        libraries:
          items:
            $ref: '#/components/schemas/Application'
          type: array
          title: Libraries
          description: Библиотеки уровня 0
      type: object
      required:
      - domain
      title: AppGraph
      description: 'Граф приложений домена: группы + приложения + библиотеки.'
    Application:
      properties:
        id:
          type: string
          minLength: 1
          title: Id
        domain_id:
          type: string
          minLength: 1
          title: Domain Id
        level:
          type: integer
          maximum: 3.0
          minimum: 0.0
          title: Level
          description: 'Уровень: 0=библиотека, 1-3=приложение'
        group_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Group Id
          description: Группа, которой принадлежит приложение
        repo_binding:
          $ref: '#/components/schemas/RepositoryBinding'
          description: Привязка к репозиторию
        pipeline_plan_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Pipeline Plan Id
          description: ID скомпилированного pipeline-плана
      type: object
      required:
      - id
      - domain_id
      - level
      - repo_binding
      title: Application
      description: Приложение внутри Domain — Level 0..3.
    ApprovalRequest:
      properties:
        decided_by:
          type: string
          minLength: 1
          title: Decided By
          description: ID оператора
        comment:
          type: string
          title: Comment
          default: ''
        signature:
          anyOf:
          - type: string
          - type: 'null'
          title: Signature
      type: object
      required:
      - decided_by
      title: ApprovalRequest
    Batch:
      properties:
        id:
          type: string
          minLength: 1
          title: Id
        plan_id:
          type: string
          minLength: 1
          title: Plan Id
        type:
          type: string
          minLength: 1
          title: Type
        status:
          type: string
          enum:
          - pending
          - running
          - passed
          - failed
          - blocked
          title: Status
          default: pending
        bricks:
          items:
            type: string
          type: array
          title: Bricks
          description: ID кирпичей в этом batch'е
        artifacts:
          items:
            type: string
          type: array
          title: Artifacts
          description: Ссылки на артефакты
        evidence:
          items:
            type: string
          type: array
          title: Evidence
          description: Ссылки на evidence-записи
      type: object
      required:
      - id
      - plan_id
      - type
      title: Batch
      description: Группа кирпичей одного типа (напр. все SAST-шаги).

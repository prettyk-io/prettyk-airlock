      responses:
        '200':
          description: 'Transition applied (успех ИЛИ first-class landing failure:
            capacity/bootstrap/reconcile failure с recovery info)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionView'
              examples:
                successful-landing:
                  summary: Successful landing (reconciled)
                  value:
                    item_id: item-rel-42-envelope
                    release_id: rel-42
                    transition: reconcile
                    state: reconciled
                    passed: true
                    recoverable: false
                    requires_new_revision: false
                    report:
                      item_id: item-rel-42-envelope
                      release_id: rel-42
                      revision_key: rel-42:1
                      state: reconciled
                      passed: true
                      checks:
                      - check: received
                        passed: true
                        detail: ''
                      - check: verified
                        passed: true
                        detail: ''
                      - check: landing_approved
                        passed: true
                        detail: ''
                      - check: imported
                        passed: true
                        detail: ''
                      - check: bootstrapped
                        passed: true
                        detail: ''
                      - check: reconciled
                        passed: true
                        detail: ''
                      reasons: []
                recoverable-bootstrap-failure:
                  summary: Recoverable bootstrap failure (retry без новой revision)
                  value:
                    item_id: item-rel-42-envelope
                    release_id: rel-42
                    transition: bootstrap
                    state: bootstrap_failure
                    passed: false
                    recoverable: true
                    requires_new_revision: false
                    report:
                      item_id: item-rel-42-envelope
                      release_id: rel-42
                      revision_key: rel-42:1
                      state: bootstrap_failure
                      passed: false
                      checks: []
                      failure_class: bootstrap_failure
                      reasons:
                      - target-side bootstrap service crash
        '409':
          description: INVALID_TRANSITION (stable, без смены состояния) · CHECKSUM_MISMATCH
            · DUPLICATE_REVISION

        \ entry_id, expected_prev_hash, stored_prev_hash}]\n  - unsealed_entries:\
        \ list[str] — id строк без якорей\n  - tampered_chain: bool — нарушена связность\
        \ цепочки\n  - replay_count: int — количество дубликатов\n  - total_entries:\
        \ int — общее количество записей\n\nCOS-068: authentication required + domain-scoping\
        \ (не-админ читает\nevidence только своего домена, ghost-404 — анти-дисклеймер)."

name: Cosmoport 2.0 CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ── Static Security & Lint Gates ──────────────────────────────────────────
  security_audit:
    name: Security & Plaintext Secret Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify No SQLite in Core Production
        run: |
          echo "Checking for prohibited SQLite database engines in production..."
          if grep -rn "sqlite://" orchestrator/cosmo/db/ 2>/dev/null; then
            echo "::error::SQLite is forbidden in Cosmoport production! Use PostgreSQL 16 only."
            exit 1
          fi
          echo "[OK] No SQLite engine detected."

      - name: Verify No Plaintext Hardcoded Tokens
        run: |
          echo "Scanning for leaked hardcoded tokens..."
          # Exclude test fixtures, documentation and regex definitions
          if grep -rnE "ghp_[a-zA-Z0-9]{30,}|squ_[a-zA-Z0-9]{30,}|glpat-[a-zA-Z0-9\-_]{20,}" \
            --exclude-dir=tests --exclude-dir=.git --exclude-dir=node_modules --exclude="*.md" \
            --exclude="vault_ref.py" --exclude="secret_ref.py" .; then
            echo "::error::Plaintext tokens detected in codebase! All credentials must use vault:secret/... references."
            exit 1
          fi
          echo "[OK] No plaintext secrets detected."

  # ── Backend lint + test ───────────────────────────────────────────────────
  backend:
    name: Backend (Python 3.13)
    runs-on: ubuntu-latest
    needs: [security_audit]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cosmo
          POSTGRES_PASSWORD: cosmo
          POSTGRES_DB: cosmo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      COSMO_DATABASE_URL: postgresql+asyncpg://cosmo:cosmo@localhost:5432/cosmo
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run backend tests
        run: |
          pytest orchestrator/tests/cosmo/ -v \
            --ignore=orchestrator/tests/cosmo/test_api_routes.py \
            --ignore=orchestrator/tests/cosmo/test_steel_thread.py \
            --ignore=orchestrator/tests/cosmo/test_run_control_plane.py \
            --ignore=orchestrator/tests/cosmo/test_valkey_pubsub.py

  # ── Frontend lint + test + build ──────────────────────────────────────────
  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  # ══════════════════════════════════════════════════════════════════════════
  # CLN-010: Hard E2E Full Lifecycle Regression Gate (NO continue-on-error)
  #
  # Если этот джоб падает — мерж невозможен. Канонический пайплайн из 8 фаз
  # должен пройти зелёным: App → Build → Plan → Run → Gate(SoD) → Release → Deploy(ЗР→ЗТ).
  # ══════════════════════════════════════════════════════════════════════════
  e2e:
    name: E2E Full Lifecycle Hard Gate (8 Phases, no continue-on-error)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cosmo
          POSTGRES_PASSWORD: cosmo
          POSTGRES_DB: cosmo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      COSMO_DATABASE_URL: postgresql+asyncpg://cosmo:cosmo@localhost:5432/cosmo
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install uvicorn

      - name: Apply Database Migrations (Alembic)
        run: alembic upgrade head

      - name: Start Cosmoport FastAPI Backend
        run: |
          python -m uvicorn orchestrator.cosmo.api.main:app \
            --host 0.0.0.0 --port 8100 --log-level info &
          API_PID=$!
          echo "API PID=$API_PID"

          # Wait for API to respond on /live and /ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8100/live >/dev/null 2>&1; then
              echo "API is live!"
              break
            fi
            echo "Waiting for API to start (attempt $i)..."
            sleep 1
          done
          curl -sf http://localhost:8100/live
          curl -sf http://localhost:8100/ready

      - name: Execute Canonical E2E Full Pipeline (Hard Gate — no continue-on-error)
        run: |
          chmod +x services/scripts/run-e2e-pipeline.sh
          ./services/scripts/run-e2e-pipeline.sh http://localhost:8100

      - name: Upload E2E Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pipeline-report
          path: reports/e2e-pipeline-report.json
          if-no-files-found: ignore
          retention-days: 14

# PrettyK Platform — OpenBao standalone (dev-контур)
#
# Канон: D:\prettyk.io\void-core\OPENBAO-PLATFORM.md (§4 dev-топология).
# Один shared OpenBao на платформу; per-product инстансы запрещены.
# Container: prettyk-openbao · Network: pk-infra (external) · Volume: prettyk_openbao.
#
# COS-178: persistent storage (raft) + static auto-unseal — AppRole cosmo-app
# и secret/cosmo/* переживают рестарт контейнера/хоста без ручных шагов.
# Unseal key (32 байта) — файл ВНЕ git: services/.openbao/unseal.key
# (создаётся и поддерживается services/scripts/openbao-bootstrap.ps1).
#
# Порт 8200 — только localhost (127.0.0.1), для диагностики и GUI; наружу не публикуется.
#
# Запуск:
#   docker network create pk-infra   # один раз
#   powershell -File services/scripts/openbao-bootstrap.ps1   # up + init + AppRole + seed

services:
  openbao:
    image: openbao/openbao:2.6.3
    container_name: prettyk-openbao
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      # CLI/healthcheck внутри контейнера: listener — plain HTTP на 0.0.0.0:8200.
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - prettyk_openbao:/openbao/file
      - ./openbao:/openbao/config:ro
      - ./.openbao:/openbao/secrets:ro
    command: ["server", "-config=/openbao/config/openbao.hcl"]
    networks:
      - pk-infra
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  prettyk_openbao:
    name: prettyk_openbao

networks:
  pk-infra:
    external: true

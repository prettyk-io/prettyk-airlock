# Cosmoport 2.0 вЂ” Docker Compose (10 services)
#
# РћС‚РґРµР»СЊРЅС‹Р№ Cosmo-РєРѕРЅС‚СѓСЂ. РЎРµС‚СЊ cosmo-net, СЃРѕР±СЃС‚РІРµРЅРЅС‹Рµ РёРЅСЃС‚Р°РЅСЃС‹ PG/Valkey/MinIO.
# РќР• Р·Р°РІРёСЃРёС‚ РѕС‚ Pure Box pk-net Рё РЅРµ СЂР°Р·РґРµР»СЏРµС‚ СЃ РЅРёРј РёРЅС„СЂР°СЃС‚СЂСѓРєС‚СѓСЂСѓ.
#
# РџРѕСЂС‚С‹ (local/dev profile):
#   5432 вЂ” cosmo-postgres    (РґРёР°РіРЅРѕСЃС‚РёРєР°)
#   6379 вЂ” cosmo-valkey       (РґРёР°РіРЅРѕСЃС‚РёРєР°)

#   9000 вЂ” cosmo-minio S3     (API; host-bind 9100: 9000 = PureK SonarQube canon)
#   9001 вЂ” cosmo-minio Console (РЅРµ РїСѓР±Р»РёРєРѕРІР°С‚СЊ РІ prod; host-bind 9101)
#   3000 вЂ” cosmo-gitea        (forge)
#   8000 вЂ” cosmo-woodpecker   (CI server)
#   8100 вЂ” cosmo-api          (FastAPI)
#   5173 вЂ” cosmo-frontend     (Vite dev / built SPA)
#   443  вЂ” cosmo-caddy        (HTTP/3 reverse proxy, single entry point)
#
# Р’ production РЅР°СЂСѓР¶Сѓ вЂ” С‚РѕР»СЊРєРѕ :443.
#
# Р—Р°РїСѓСЃРє:
#   docker compose -f docker-compose.yml up -d

services:
  # в”Ђв”Ђ Infra (Persistence layer) в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ

  cosmo-postgres:
    image: postgres:16-alpine
    # digest-pin: sha256 Р·Р°С„РёРєСЃРёСЂРѕРІР°С‚СЊ РїСЂРё production freeze
    container_name: cosmo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${COSMO_PG_USER:-cosmo}
      POSTGRES_PASSWORD: ${COSMO_PG_PASSWORD:-cosmo}
      POSTGRES_DB: ${COSMO_PG_DB:-cosmo}
    volumes:
      - cosmo_postgres:/var/lib/postgresql/data
      # COS-063: side DBs (gitea, woodpecker) on fresh volumes
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COSMO_PG_USER:-cosmo} -d ${COSMO_PG_DB:-cosmo}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  cosmo-valkey:
    image: valkey/valkey:8-alpine
    # digest-pin: sha256 Р·Р°С„РёРєСЃРёСЂРѕРІР°С‚СЊ РїСЂРё production freeze
    container_name: cosmo-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - cosmo_valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  cosmo-minio:
    profiles: ["full"]
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    # digest-pin: sha256 Р·Р°С„РёРєСЃРёСЂРѕРІР°С‚СЊ РїСЂРё production freeze
    container_name: cosmo-minio
    restart: unless-stopped
    ports:
      # Host 9100/9101: 9000/9001 = PureK SonarQube canon (RUN-STACK).
      # Coexistence of both stacks on one Docker host must never fight over binds.
      - "9100:9000"
      - "9101:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${COSMO_MINIO_USER:-cosmo}
      MINIO_ROOT_PASSWORD: ${COSMO_MINIO_PASSWORD:-cosmo-minio-dev}
    volumes:
      - cosmo_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # в”Ђв”Ђ Forge + CI в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ

  cosmo-gitea:
    profiles: ["full"]
    image: gitea/gitea:1.22.6
    # digest-pin: sha256 Р·Р°С„РёРєСЃРёСЂРѕРІР°С‚СЊ РїСЂРё production freeze
    container_name: cosmo-gitea
    restart: unless-stopped
    ports:
      # COS-063: host 3000 belongs to PureK lab (juice-shop). Internal stays 3000.
      - "3100:3000"
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: cosmo-postgres
      GITEA__database__NAME: cosmo_gitea
      GITEA__database__USER: ${COSMO_PG_USER:-cosmo}
      GITEA__database__PASSWD: ${COSMO_PG_PASSWORD:-cosmo}
      # COS-063: skip install wizard, activate /api/v1 (healthcheck depends on it).
      # Admin user created idempotently in cosmo-start.ps1 (dev creds via .env, rotate for prod).
      GITEA__security__INSTALL_LOCK: "true"
      # COS-188: clone-URL должен резолвиться из контейнеров контура
      # (woodpecker-agent клонирует из cosmo-net; localhost:3000 изнутри
      # контейнера — сам агент, не Gitea). Хостовый UI остаётся на :3100.
      GITEA__server__ROOT_URL: http://cosmo-gitea:3000
      # COS-096: default ALLOWED_HOST_LIST=external blocks RFC-private hosts,
      # пишущий cosmo-api:8100 и webhook'и на них не проходят; private = docker-сеть.
      GITEA__webhook__ALLOWED_HOST_LIST: "private"
    volumes:
      - cosmo_gitea:/data
    depends_on:
      cosmo-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  cosmo-woodpecker:
    profiles: ["full"]
    image: woodpeckerci/woodpecker-server:v3.5
    # digest-pin: sha256 Р·Р°С„РёРєСЃРёСЂРѕРІР°С‚СЊ РїСЂРё production freeze
    container_name: cosmo-woodpecker
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      WOODPECKER_OPEN: "true"
      WOODPECKER_GITEA: "true"
      WOODPECKER_GITEA_URL: http://cosmo-gitea:3000
      WOODPECKER_HOST: http://cosmo-woodpecker:8000
      WOODPECKER_DATABASE_DRIVER: postgres
      WOODPECKER_DATABASE_DATASOURCE: postgres://${COSMO_PG_USER:-cosmo}:${COSMO_PG_PASSWORD:-cosmo}@cosmo-postgres:5432/cosmo_woodpecker?sslmode=disable
      # COS-063: pin shared agent secret server-side (else server generates random,
      # agent never authenticates, DeadlineExceeded loop).
      WOODPECKER_AGENT_SECRET: ${COSMO_WOODPECKER_AGENT_SECRET:-dev-agent-secret-change-me}
    volumes:
      - cosmo_woodpecker:/var/lib/woodpecker
    depends_on:
      cosmo-postgres:
        condition: service_healthy
      cosmo-gitea:
        condition: service_healthy
    # COS-063: v3.5 image is distroless (no sh/curl/wget, no healthcheck subcommand).
    # Liveness probed externally in smoke-delivery.ps1 (http://localhost:8000/api/health).
    healthcheck:
      disable: true

  cosmo-woodpecker-agent:
    profiles: ["full"]
    image: woodpeckerci/woodpecker-agent:v3.5
    # digest-pin: sha256 Р·Р°С„РёРєСЃРёСЂРѕРІР°С‚СЊ РїСЂРё production freeze
    container_name: cosmo-woodpecker-agent
    restart: unless-stopped
    environment:
      # COS-063: passthrough:/// prefix bypasses grpc-go dns resolver, whose
      # SRV/TXT lookups hang on Docker embedded DNS (127.0.0.11) -> agent
      # auth DeadlineExceeded loop. Proven by minimal Go client test.
      WOODPECKER_SERVER: passthrough:///cosmo-woodpecker:9000
      WOODPECKER_AGENT_SECRET: ${COSMO_WOODPECKER_AGENT_SECRET:-dev-agent-secret-change-me}
      WOODPECKER_MAX_WORKFLOWS: "4"
      # COS-188: шаговые контейнеры — в сети контура, иначе clone-plugin не
      # резолвит cosmo-gitea ('Could not resolve host', exit 128).
      WOODPECKER_BACKEND_DOCKER_NETWORK: "cosmo-net"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # COS-063: deliberately NO persisted agent.conf — after server DB wipe the
      # stale agent_id causes auth deadlock ("AgentID not found"). Stateless
      # re-register on start is the safe default for local delivery.
      # Log line "could not persist agent config" is expected cosmetic noise.
    depends_on:
      cosmo-woodpecker:
        # server is distroless (no internal healthcheck); agent retries gRPC itself
        condition: service_started

  # в”Ђв”Ђ Application layer в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ

  cosmo-api:
    build:
      context: ..
      dockerfile: services/cosmo-api.Dockerfile
    image: cosmo-api:${COSMO_API_TAG:-local}
    container_name: cosmo-api
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      PK_DEPLOY_PROFILE: local
      COSMO_DATABASE_URL: postgresql+asyncpg://${COSMO_PG_USER:-cosmo}:${COSMO_PG_PASSWORD:-cosmo}@cosmo-postgres:5432/${COSMO_PG_DB:-cosmo}
      PK_PG_DSN: postgresql+asyncpg://${COSMO_PG_USER:-cosmo}:${COSMO_PG_PASSWORD:-cosmo}@cosmo-postgres:5432/${COSMO_PG_DB:-cosmo}
      PK_VALKEY_HOST: cosmo-valkey
      PK_VALKEY_PORT: "6379"
      PK_GITEA_URL: http://cosmo-gitea:3000
      PK_GITEA_USER: ${COSMO_FORGE_USER:-cosmo}
      PK_GITEA_PASSWORD: ${COSMO_FORGE_ADMIN_PASSWORD:-cosmo-admin-dev}
      PK_GITEA_WEBHOOK_SECRET: ${COSMO_GITEA_WEBHOOK_SECRET:-dev-webhook-secret-change-me}
      PK_PUBLIC_API_URL: ${COSMO_PUBLIC_API_URL:-http://cosmo-api:8100}
      PK_WOODPECKER_URL: http://cosmo-woodpecker:8000
      # SAST-STEP-1: живой execution-контур (run → batch → Woodpecker submit →
      # evidence/capture hooks). Opt-in по дизайну COS-097; на стенде нужен
      # для live-прогонов source-SAST (seed-sast-fixture.py). Выключить: убрать строку.
      COSMO_EXECUTOR_ENABLED: "1"
      # COS-188: WP API-токен (JWT, выпускает seed-woodpecker-fixture.py в .env) —
      # SSE-логи прогонов и opt-in executor ходят в Woodpecker авторизованно.
      COSMO_WOODPECKER_TOKEN: ${COSMO_WOODPECKER_TOKEN:-}
      PK_MINIO_URL: http://cosmo-minio:9000
      PK_MINIO_ACCESS_KEY: ${COSMO_MINIO_USER:-cosmo}
      PK_MINIO_SECRET_KEY: ${COSMO_MINIO_PASSWORD:-cosmo-minio-dev}
      # COS-171/172/183: scanner tools (trivy/syft/grype) + точечный insecure-allow.
      # TRIVY_CACHE_DIR / GRYPE_DB_CACHE_DIR — единые: build == ENV == volume ниже.
      TRIVY_CACHE_DIR: /var/lib/trivy
      GRYPE_DB_CACHE_DIR: /var/lib/grype
      # Insecure ТОЛЬКО через allowlist (registry_policy). Никакого глобального
      # TRIVY_INSECURE / SYFT_REGISTRY_INSECURE_USE_HTTP.
      INSECURE_REGISTRY_HOSTS: cosmo-registry-zr:5000
      # Контейнерная адресация registry ЗР (НЕ localhost:5100): image_ref внутри
      # cosmo-api обязан резолвиться через cosmo-net.
      REGISTRY_ZR_ENDPOINT: http://cosmo-registry-zr:5000
      # COS-173: platform OpenBao (AppRole cosmo-app); creds in .env (gitignored)
      VAULT_ADDR: http://prettyk-openbao:8200
      VAULT_APPROLE_ROLE_ID: ${VAULT_APPROLE_ROLE_ID:-}
      VAULT_APPROLE_SECRET_ID: ${VAULT_APPROLE_SECRET_ID:-}
    volumes:
      # Офлайн DB сканеров: seed из образа при первом старте (entrypoint).
      - cosmo_trivy_cache:${TRIVY_CACHE_DIR:-/var/lib/trivy}
      - cosmo_grype_cache:${GRYPE_DB_CACHE_DIR:-/var/lib/grype}
    networks:
      - default
      - pk-infra
    depends_on:
      cosmo-postgres:
        condition: service_healthy
      cosmo-valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/live')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  cosmo-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: cosmo-frontend:${COSMO_FRONTEND_TAG:-local}
    container_name: cosmo-frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      cosmo-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # в”Ђв”Ђ Edge в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ

  cosmo-caddy:
    build:
      context: .
      dockerfile: cosmo-caddy.Dockerfile
    image: cosmo-caddy:local
    # digest-pin: sha256 Р·Р°С„РёРєСЃРёСЂРѕРІР°С‚СЊ РїСЂРё production freeze
    container_name: cosmo-caddy
    restart: unless-stopped
    # Cosmoport 2.0 вЂ” single canonical edge: 8180 (main Caddy).
    # 8080 reserved for PureK / ZAP Demon вЂ” NEVER use for Cosmoport.
    ports:
      - "8180:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - cosmo_caddy_data:/data
      - cosmo_caddy_config:/config
    environment:
      REGISTRY_ZR_HOST: "cosmo-registry-zr:5000"
    depends_on:
      cosmo-api:
        condition: service_started
    healthcheck:
      # COS-059: /live is the canonical liveness route (Caddy health block).
      # /api/live does not exist as a route вЂ” healthcheck was permanently unhealthy.
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:80/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -- PTY sandbox (COS-189 §4-5 / PTY-SANDBOX-1; default-off profile "pty") --
  # Ephemeral-контейнер на сессию: владеет docker.sock, создаёт изолированные
  # сессии (allowlist-инструменты, network none, ro-rootfs, лимиты, TTL).
  # Без `--profile pty` сервис не поднимается и стенд не затрагивается.
  pty-sandbox:
    profiles: ["pty"]
    build:
      context: ./pty-sandbox/service
      dockerfile: Dockerfile
    image: cosmo-pty-sandbox:local
    container_name: pty-sandbox
    restart: unless-stopped
    ports:
      - "127.0.0.1:8190:8190"
    environment:
      PTY_SANDBOX_IMAGE: "pty-sandbox-base:local"
      PTY_SANDBOX_IDLE_TTL_S: "900"
      PTY_SANDBOX_HARD_TTL_S: "3600"
      PTY_SANDBOX_MAX_SESSIONS: "4"
      PTY_SANDBOX_AUDIT_LOG: "/var/log/pty-sandbox/audit.jsonl"
      PTY_SANDBOX_MAX_DELIVERY_MB: "${PTY_SANDBOX_MAX_DELIVERY_MB:-32}"
      PTY_SANDBOX_MAX_DELIVERY_FILES: "${PTY_SANDBOX_MAX_DELIVERY_FILES:-2000}"
      PTY_SANDBOX_MAX_UNPACKED_MB: "${PTY_SANDBOX_MAX_UNPACKED_MB:-48}"
      PTY_SANDBOX_DEBUG: "${PTY_SANDBOX_DEBUG:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - pty_sandbox_audit:/var/log/pty-sandbox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8190/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

# в”Ђв”Ђ Volumes в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ

volumes:
  cosmo_postgres:
  cosmo_valkey:
  cosmo_minio:
  cosmo_gitea:
  cosmo_woodpecker:
  cosmo_caddy_data:
  cosmo_caddy_config:
  cosmo_trivy_cache:
  cosmo_grype_cache:
  pty_sandbox_audit:

# в”Ђв”Ђ Network в”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђв”Ђ

networks:
  default:
    name: cosmo-net
    # cosmo-net belongs to Cosmoport only. Never connect to pk-net.
    # docker network create cosmo-net вЂ” РїСЂРё РїРµСЂРІРѕРј Р·Р°РїСѓСЃРєРµ.
    # external: false РѕР·РЅР°С‡Р°РµС‚ С‡С‚Рѕ compose СЃРѕР·РґР°СЃС‚ СЃРµС‚СЊ СЃР°Рј.
  pk-infra:
    external: true

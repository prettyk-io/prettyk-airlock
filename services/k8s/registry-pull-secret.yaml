# OWN-BUDDY-001: Kubernetes imagePullSecret for Artifact Registry
#
# Создаёт docker-registry secret для pull образов из Cosmo Artifact Registry.
# Используется в Deployment manifests для pull по immutable digest.
#
# Применение:
#   kubectl apply -f services/k8s/registry-pull-secret.yaml
#   или через Helm: {{ include "cosmo.imagePullSecret" . }}
#
# Secret ref: vault:secret/cosmo/registry/zr/robot-account
# Никаких plaintext паролей в манифесте.
apiVersion: v1
kind: Secret
metadata:
  name: cosmo-registry-pull-secret
  namespace: cosmo-system
  labels:
    app.kubernetes.io/part-of: cosmoport
    cosmoport.role: registry-credentials
type: kubernetes.io/dockerconfigjson
data:
  # dockerconfigjson генерируется командой:
  # kubectl create secret docker-registry cosmo-registry-pull-secret \
  #   --docker-server=localhost:5100 \
  #   --docker-username=cosmo-ci \
  #   --docker-password=$(vault read -field=password secret/cosmo/registry/zr/robot-account) \
  #   --namespace=cosmo-system \
  #   --dry-run=client -o json | jq '.data[".dockerconfigjson"]'
  .dockerconfigjson: ""
# Cosmoport 2.0 — Helm chart values

# ── Namespace ──
namespace: cosmo-system

# ── Global labels ──
global:
  labels:
    app.kubernetes.io/part-of: cosmoport

# ─────────────────────────────────────────────────────────────────────────────
# OWN-BUDDY-001: Artifact Registry — pull by immutable digest
# ─────────────────────────────────────────────────────────────────────────────
registry:
  # Провайдер: local-oci (dev), nexus (staging), t1_sfera (UNKNOWN)
  provider: "local-oci"

  # Создать imagePullSecret (kubernetes.io/dockerconfigjson)
  createPullSecret: true
  pullSecretName: "cosmo-registry-pull-secret"

  # dockerconfigjson — base64-кодированный JSON с credentials
  # Генерация: kubectl create secret docker-registry <name> --dry-run=client -o json | jq '.data[".dockerconfigjson"]'
  # НИКОГДА не хардкодить plaintext пароль здесь.
  dockerConfigJson: ""

  # Зона, из которой pull (zr по умолчанию)
  pullZone: "zr"

  # Endpoint registry — внешний (host) или внутренний (Docker/K8s DNS)
  # Хост: localhost:5100
  # Docker: cosmo-registry-zr:5000
  # K8s:   cosmo-registry-zr.cosmo-system.svc.cluster.local:5000
  endpoint: "localhost:5100"

  # Использовать immutable digest вместо mutable tag для образов
  # При true — image: "repo/image@sha256:digest"
  # При false — image: "repo/image:tag"
  useDigest: false

# ── API (FastAPI) ──
api:
  enabled: true
  replicas: 2
  image:
    repository: cosmo-api
    tag: local
    digest: ""            # OWN-BUDDY-001: sha256:... при useDigest=true
    pullPolicy: IfNotPresent
  service:
    port: 8100
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: 1000m
  env:
    PK_DEPLOY_PROFILE: production
    PK_MINIO_URL: http://cosmo-minio:9000
  health:
    livenessPath: /live
    readinessPath: /ready
    port: 8100

# ── Frontend (nginx SPA) ──
frontend:
  enabled: true
  replicas: 2
  image:
    repository: cosmo-frontend
    tag: local
    digest: ""            # OWN-BUDDY-001
    pullPolicy: IfNotPresent
  service:
    port: 80
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

# ── Ingress / Caddy ──
ingress:
  enabled: true
  host: cosmoport.local
  tls:
    enabled: false
    secretName: cosmo-tls

# ── Postgres (external reference) ──
postgres:
  host: cosmo-postgres.cosmo-infra.svc.cluster.local
  port: 5432
  user: cosmo
  database: cosmo
  existingSecret: cosmo-postgres-credentials
  existingSecretKey: password

# ── Valkey (external reference) ──
valkey:
  host: cosmo-valkey.cosmo-infra.svc.cluster.local
  port: 6379

# ── MinIO (external reference) ──
minio:
  endpoint: cosmo-minio.cosmo-infra.svc.cluster.local
  port: 9000
  existingSecret: cosmo-minio-credentials
  existingSecretKey:
    accessKey: accesskey
    secretKey: secretkey

# ── Migration job ──
migration:
  enabled: true
  image:
    repository: cosmo-api
    tag: local
    digest: ""            # OWN-BUDDY-001
  backoffLimit: 3

# ── Network policy ──
networkPolicy:
  enabled: true
  ingressNamespaces:
    - ingress-nginx
    - kube-system

# ── Service account ──
serviceAccount:
  create: true
  name: cosmo-controller

# ── RBAC ──
rbac:
  create: true

# ── ConfigMap ──
configmap:
  PK_DEPLOY_PROFILE: production
  PK_MINIO_URL: http://cosmo-minio:9000

# ── Node selector / tolerations ──
nodeSelector: {}
tolerations: []
affinity: {}
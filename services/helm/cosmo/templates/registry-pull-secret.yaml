{{/* OWN-BUDDY-001: Helm template — imagePullSecret для Artifact Registry */}}
{{- define "cosmo.imagePullSecret" }}
{{- if .Values.registry.createPullSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.registry.pullSecretName | default "cosmo-registry-pull-secret" }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cosmo.labels" . | nindent 4 }}
    cosmoport.role: registry-credentials
    cosmoport.provider: {{ .Values.registry.provider | quote }}
    cosmoport.zone: {{ .Values.registry.pullZone | quote }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.registry.dockerConfigJson }}
{{- end }}
{{- end }}
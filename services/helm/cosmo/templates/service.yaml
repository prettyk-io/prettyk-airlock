# Cosmo API Service.
apiVersion: v1
kind: Service
metadata:
  name: cosmo-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cosmo.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "cosmo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
---
# Cosmo Frontend Service.
apiVersion: v1
kind: Service
metadata:
  name: cosmo-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cosmo.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "cosmo.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
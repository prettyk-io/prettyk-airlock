{{- if .Values.networkPolicy.enabled }}
# Cosmo default-deny + allow ingress from controller namespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cosmo-isolate
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cosmo.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              name: {{ . }}
        {{- end }}
    # Allow intra-namespace traffic
    - from:
        - podSelector: {}
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - port: 53
          protocol: UDP
    # Allow infra services
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: cosmoport
    # Allow egress to any (needed for Gitea/Woodpecker/MinIO if external)
    - to: []
{{- end }}
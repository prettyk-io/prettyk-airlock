# Cosmo Frontend deployment (nginx SPA, OWN-BUDDY-001: digest support).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cosmo-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cosmo.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "cosmo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "cosmo.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      {{- if .Values.registry.createPullSecret }}
      imagePullSecrets:
        - name: {{ .Values.registry.pullSecretName | default "cosmo-registry-pull-secret" }}
      {{- end }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: frontend
          {{- if and .Values.registry.useDigest .Values.frontend.image.digest }}
          image: "{{ .Values.frontend.image.repository }}@{{ .Values.frontend.image.digest }}"
          {{- else }}
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.service.port }}
              name: http
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.frontend.service.port }}
            initialDelaySeconds: 2
            periodSeconds: 10